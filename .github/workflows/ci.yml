name: Build and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 build and tests
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Read version and validate release tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/release_metadata.py --tag "$env:GITHUB_REF_NAME" --github-output "$env:GITHUB_OUTPUT"
          } else {
            python scripts/release_metadata.py --github-output "$env:GITHUB_OUTPUT"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Win64 atomic primitives
        shell: cmd
        run: scripts\build_native.cmd
      - name: Run unit tests against the compiled DLL
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q maxcraft scripts tests install_maxcraft.py launch_maxcraft.py
      - name: Package plugin and SHA-256 checksum
        run: python scripts/package.py
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MaxCraft-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/${{ steps.version.outputs.archive }}
            dist/${{ steps.version.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MaxCraft-${{ needs.build.outputs.version }}-windows-x64
          path: dist
      - name: Verify downloaded package
        working-directory: dist
        run: sha256sum --check --strict *.sha256
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "MaxCraft $RELEASE_TAG" --generate-notes "${args[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
